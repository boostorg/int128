name: CUDA tests (simulated H100)

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the CUDA tests (test/cuda_jamfile) and runs them on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "include/**"
      - "test/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-sim:
    name: CUDA 13.0 simulated H100 C++17 shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # The CUDA tests are compile-bound, so each shard builds and runs
        # every third test.
        shard: [ 0, 1, 2 ]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make

      - name: Setup Boost
        run: |
          LIBRARY=${GITHUB_REPOSITORY#*/}
          echo "LIBRARY=$LIBRARY" >> $GITHUB_ENV
          REF=${GITHUB_BASE_REF:-$GITHUB_REF}
          REF=${REF#refs/heads/}
          BOOST_BRANCH=develop && [ "$REF" == "master" ] && BOOST_BRANCH=master || true
          cd ..
          git clone -b $BOOST_BRANCH --depth 1 https://github.com/boostorg/boost.git boost-root
          cd boost-root
          mkdir -p libs/$LIBRARY
          cp -r $GITHUB_WORKSPACE/* libs/$LIBRARY
          git submodule update --init tools/boostdep
          python3 tools/boostdep/depinst/depinst.py --git_args "--jobs 3" $LIBRARY

      # The simulator runs PTX only (90-virtual) and needs a shared CUDA runtime.
      - name: Configure
        run: |
          cd ../boost-root
          mkdir __build__ && cd __build__
          cmake -DBOOST_INCLUDE_LIBRARIES=$LIBRARY -DBUILD_TESTING=ON \
                -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc \
                -DCUDAToolkit_ROOT=/usr/local/cuda-13.0 \
                -DBOOST_INT128_ENABLE_CUDA=1 \
                -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
                -DCMAKE_CUDA_STANDARD=17 \
                -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared ..

      - name: Build tests
        run: |
          cd ../boost-root/__build__
          # This shard's tests; a run test named run-X runs the executable target X, which is built here:
          ctest -N | sed -n 's/^ *Test *#[0-9]*: //p' | awk 'NR % 3 == ${{ matrix.shard }}' > shard_tests.txt
          echo "$(wc -l < shard_tests.txt) tests in this shard"
          cmake --build . -j3 --target $(sed -n 's/^run-//p' shard_tests.txt)

      - name: Run tests on the simulated H100
        run: |
          cd ../boost-root/__build__
          vgpu run ctest --output-on-failure --no-tests=error -j3 -R "^($(paste -sd '|' shard_tests.txt))\$"
